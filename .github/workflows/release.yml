name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            binary: eco.exe
            archive: eco-win-x64.zip
          - os: ubuntu-latest
            rid: linux-x64
            binary: eco
            archive: eco-linux-x64.tar.gz
          - os: macos-latest
            rid: osx-arm64
            binary: eco
            archive: eco-osx-arm64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install Linux AOT prerequisites
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Derive version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish AOT single-file native binary
        run: dotnet publish EcoPlugSender/EcoPlugSender.csproj -c Release -r ${{ matrix.rid }} -p:PublishAot=true -p:Version=${{ steps.version.outputs.value }} --self-contained true -o publish

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: Compress-Archive -Path publish/${{ matrix.binary }} -DestinationPath ${{ matrix.archive }}

      - name: Package (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: tar -czf ${{ matrix.archive }} -C publish ${{ matrix.binary }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          repository: findyoucef/eco-releases
          token: ${{ secrets.RELEASES_REPO_TOKEN }}
          files: artifacts/*
          fail_on_unmatched_files: true
